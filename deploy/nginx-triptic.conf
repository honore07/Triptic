# ⚠️ NON UTILISÉ EN PRODUCTION — conservé seulement pour un futur VPS sous Nginx.
# Le VPS actuel n'a PAS de Nginx : Traefik (Docker) tient les ports 80/443 et
# gère déjà le certificat Let's Encrypt de triptic.hakoe-alsace.com.
# Installer nginx/certbot ici entrerait en conflit sur le port 80 et couperait
# tous les sites de la machine. Voir deploy/RUNBOOK-https.md.
#
# Nginx — reverse proxy TRIPTIC (VPS Hostinger)
# /etc/nginx/sites-available/triptic → symlink dans sites-enabled
#
# Tout est proxifié vers Express (:3001) : c'est lui qui sert l'UI buildée,
# la compression, le cache des assets hashés et l'injection des balises OG
# sur /trip/:slug. Nginx n'apporte que le TLS (certbot) et le HTTP/1.1 SSE.
# Certbot ajoutera lui-même le bloc listen 443 + redirection 80→443.

server {
    listen 80;
    server_name triptic.hakoe-alsace.com triptic.app www.triptic.app;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (génération de trips en streaming) : ne pas bufferiser
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
